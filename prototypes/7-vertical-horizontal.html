<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JK — vertical + horizontal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}html,body{margin:0}
body{background:#060B18;color:#EAF1FB;font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.scroll{height:560vh;position:relative}
.viewport{position:sticky;top:0;height:100vh;height:100dvh;overflow:hidden;
  background:radial-gradient(80% 60% at 50% 45%,rgba(79,168,240,.12),transparent 60%),radial-gradient(120% 120% at 50% 30%,#0B1830 0%,#081124 46%,#060B18 100%),
  radial-gradient(circle at 1px 1px,rgba(127,227,255,.04) 1px,transparent 0);background-size:auto,auto,34px 34px}
.svg{position:absolute;inset:0;width:100%;height:100%;display:block;z-index:5}
.hud-fr{position:absolute;inset:22px;pointer-events:none;z-index:15}
.hud-fr sp{position:absolute;width:20px;height:20px;border:1.5px solid rgba(127,227,255,.3)}
.hud-fr .tl{top:0;left:0;border-right:0;border-bottom:0}.hud-fr .tr{top:0;right:0;border-left:0;border-bottom:0}
.hud-fr .bl{bottom:0;left:0;border-right:0;border-top:0}.hud-fr .br{bottom:0;right:0;border-left:0;border-top:0}
.cap{position:absolute;left:50%;bottom:11%;transform:translateX(-50%);z-index:16;text-align:center;transition:opacity .35s}
.cap .k{font-family:'JetBrains Mono';font-size:12px;letter-spacing:.16em;color:#7FE3FF;margin-bottom:8px}
.cap h2{font-family:'Space Grotesk';font-weight:700;font-size:clamp(24px,3.6vw,40px);letter-spacing:-.02em;margin:0}
.read{position:absolute;top:28px;left:30px;z-index:16;font-family:'JetBrains Mono';font-size:11.5px;color:#8fa6c4}.read b{color:#7FE3FF}
.token{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:20;pointer-events:none}
.token .dot{width:17px;height:17px;border-radius:50%;background:radial-gradient(circle,#fff 30%,#7FE3FF 72%);
  box-shadow:0 0 18px 6px rgba(127,227,255,.85);animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 18px 6px rgba(127,227,255,.8)}50%{box-shadow:0 0 24px 9px rgba(127,227,255,1)}}
.cue{position:absolute;left:50%;bottom:20px;transform:translateX(-50%);z-index:16;font-family:'JetBrains Mono';font-size:11px;letter-spacing:.1em;color:#8fa6c4;display:flex;flex-direction:column;align-items:center;gap:5px}
.cue .a{color:#7FE3FF;animation:bob 1.8s ease-in-out infinite}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(5px)}}
@media (prefers-reduced-motion:reduce){.token .dot,.cue .a{animation:none}}
</style>
</head>
<body>
<div class="scroll" id="scroll">
  <div class="viewport">
    <svg class="svg" id="svg" viewBox="0 0 1200 760" aria-hidden="true"><g id="world"></g></svg>
    <div class="hud-fr"><sp class="tl"></sp><sp class="tr"></sp><sp class="bl"></sp><sp class="br"></sp></div>
    <div class="read">FIL · <b id="pct">0%</b></div>
    <div class="token"><div class="dot"></div></div>
    <div class="cap" id="cap"><div class="k" id="ck">VERTICAL</div><h2 id="ch">Le fil descend.</h2></div>
    <div class="cue"><span>défiler</span><span class="a">↓</span></div>
  </div>
</div>

<script>
const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
const NS='http://www.w3.org/2000/svg';
const mk=(t,a)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);return e;};
const rgba=(c,a)=>`rgba(${c[0]},${c[1]},${c[2]},${a})`;
const CYAN=[127,227,255],BLUE=[79,168,240],TEAL=[63,214,200],INDIGO=[110,123,242],GREEN=[110,220,150];

// chemin de workflow qui TOURNE : descend -> droite -> descend (virages à 90°)
const WP=[[430,140],[430,620],[2100,620],[2100,1120]];
function polyRound(pts,r){
  const at=(a,b,r)=>{const dx=b[0]-a[0],dy=b[1]-a[1],L=Math.hypot(dx,dy);return[a[0]+dx/L*r,a[1]+dy/L*r];};
  let d=`M ${pts[0][0]} ${pts[0][1]}`;
  for(let i=1;i<pts.length-1;i++){const cur=pts[i],a=at(cur,pts[i-1],r),b=at(cur,pts[i+1],r);
    d+=` L ${a[0]} ${a[1]} Q ${cur[0]} ${cur[1]} ${b[0]} ${b[1]}`;}
  d+=` L ${pts[pts.length-1][0]} ${pts[pts.length-1][1]}`; return d;
}
const world=document.getElementById('world');
const d=polyRound(WP,46);
// lueur + rail + pointillé
const glow=mk('path',{d,fill:'none',stroke:rgba(CYAN,.25),'stroke-width':'12',filter:'blur(6px)','stroke-linecap':'round','stroke-linejoin':'round'});world.appendChild(glow);
const rail=mk('path',{d,fill:'none',stroke:rgba(CYAN,.55),'stroke-width':'2.5','stroke-dasharray':'2 12','stroke-linecap':'round','stroke-linejoin':'round'});world.appendChild(rail);
const measure=mk('path',{d,fill:'none',stroke:'none'});world.appendChild(measure);
const LEN=measure.getTotalLength();

// noeuds n8n le long du chemin
const NODES=[
  {t:'Déclencheur',   s:'trigger',c:GREEN, x:430, y:400},
  {t:'Analyse',       s:'IA',     c:BLUE,  x:720, y:620},
  {t:'Lecture OCR',   s:'vision', c:TEAL,  x:1060,y:620},
  {t:'Routage',       s:'logique',c:INDIGO,x:1400,y:620},
  {t:'Enrichissement',s:'valeur', c:BLUE,  x:1740,y:620},
  {t:'Résultat',      s:'sortie', c:CYAN,  x:2100,y:900},
];
NODES.forEach(n=>{const g=mk('g',{});const w=178;
  g.appendChild(mk('rect',{x:n.x-w/2,y:n.y-23,width:w,height:46,rx:13,fill:'rgba(12,26,46,.95)',stroke:rgba(n.c,.6),'stroke-width':'1.6'}));
  g.appendChild(mk('rect',{x:n.x-w/2,y:n.y-23,width:6,height:46,rx:3,fill:rgba(n.c,1)}));
  g.appendChild(mk('circle',{cx:n.x-w/2+18,cy:n.y,r:5,fill:rgba(n.c,1)}));
  const s=mk('text',{x:n.x-w/2+34,y:n.y-4,fill:'#8fa6c4','font-family':'JetBrains Mono','font-size':'9.5'});s.textContent=n.s;g.appendChild(s);
  const t=mk('text',{x:n.x-w/2+34,y:n.y+13,fill:'#EAF1FB','font-family':'Space Grotesk','font-size':'15','font-weight':'600'});t.textContent=n.t;g.appendChild(t);
  n.g=g;world.appendChild(g);
});

const cap=document.getElementById('cap'),ck=document.getElementById('ck'),ch=document.getElementById('ch'),pct=document.getElementById('pct');
// 3 phases selon la portion du chemin : verticale / horizontale / verticale
const PH=[[0,'VERTICAL','Le fil descend.'],[0.17,'VIRAGE →','Il part à l\u2019horizontale.'],[0.80,'VERTICAL','Et reprend sa descente.']];
let cur=-1;

function loop(){
  const sc=document.getElementById('scroll'),rect=sc.getBoundingClientRect();
  let p=Math.max(0,Math.min(1,(-rect.top)/(sc.offsetHeight-innerHeight)));
  const pt=measure.getPointAtLength(LEN*p);
  // caméra : centre le token. En leg 1/3 elle bouge en Y (vertical), en leg 2 elle bouge en X (horizontal) — même scroll !
  world.setAttribute('transform',`translate(${600-pt.x} ${380-pt.y})`);

  NODES.forEach(n=>{const dx=n.x-pt.x,dy=n.y-pt.y,near=Math.hypot(dx,dy)<130;
    n.g.style.filter=near?`drop-shadow(0 0 10px ${rgba(n.c,.7)})`:'none';});

  let ph=PH[0];for(const x of PH)if(p>=x[0])ph=x;
  if(ph!==PH[cur]){cur=PH.indexOf(ph);cap.style.opacity=0;setTimeout(()=>{ck.textContent=ph[1];ch.textContent=ph[2];cap.style.opacity=1;},160);}
  pct.textContent=Math.round(p*100)+'%';
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
