<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JK — l'origine du fil</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}html,body{margin:0}
body{font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.scroll{height:320vh;position:relative}
.viewport{position:sticky;top:0;height:100vh;height:100dvh;overflow:hidden}
.svg{position:absolute;inset:0;width:100%;height:100%;display:block;z-index:5}
.cap{position:absolute;left:0;right:0;bottom:12%;text-align:center;z-index:16;transition:opacity .35s}
.cap .k{font-family:'JetBrains Mono';font-size:12px;letter-spacing:.16em;margin-bottom:8px}
.cap h2{font-family:'Space Grotesk';font-weight:700;font-size:clamp(26px,4vw,44px);letter-spacing:-.02em;margin:0}
.cue{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);z-index:16;font-family:'JetBrains Mono';font-size:11px;letter-spacing:.1em;display:flex;flex-direction:column;align-items:center;gap:5px}
.cue .a{animation:bob 1.8s ease-in-out infinite}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(5px)}}
.eye{animation:blink 4.6s ease-in-out infinite}@keyframes blink{0%,92%,100%{opacity:1}95%{opacity:.15}}
@media (prefers-reduced-motion:reduce){.cue .a,.eye{animation:none}}
</style>
</head>
<body>
<div class="scroll" id="scroll">
  <div class="viewport" id="viewport">
    <svg class="svg" id="svg" viewBox="0 0 1200 760" aria-hidden="true">
      <defs><radialGradient id="rbg"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#cfe0f2"/></radialGradient></defs>
      <g id="bureau"></g>
      <g id="method"></g>
      <circle id="seed" cx="600" cy="300" r="0"></circle>
    </svg>
    <div class="cap" id="cap"><div class="k" id="ck">LE RÉSULTAT</div><h2 id="ch">Votre bureau, agents en place.</h2></div>
    <div class="cue" id="cue"><span>rembobiner</span><span class="a">↓</span></div>
  </div>
</div>

<script>
const NS='http://www.w3.org/2000/svg';
const mk=(t,a)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);return e;};
const seg=(p,a,b)=>Math.max(0,Math.min(1,(p-a)/(b-a)));
const ease=t=>1-Math.pow(1-t,3);
const lerp=(a,b,t)=>a.map((v,i)=>v+(b[i]-v)*t);
const cl=v=>Math.max(0,Math.min(255,v|0));
const rgba=(c,a)=>`rgba(${cl(c[0])},${cl(c[1])},${cl(c[2])},${a})`;
const shade=(c,f)=>`rgb(${cl(c[0]*f)},${cl(c[1]*f)},${cl(c[2]*f)})`;
const CX=600,CY=210,TW=148,TH=74,HU=48;
const iso=(gx,gy,gz=0)=>[CX+(gx-gy)*TW/2, CY+(gx+gy)*TH/2-gz*HU];
const Pp=(...p)=>p.map(q=>q.join(',')).join(' ');
function roundPath(parent,pts,r,fill,ex){const n=pts.length;let d='';const at=(a,b,r)=>{const dx=b[0]-a[0],dy=b[1]-a[1],L=Math.hypot(dx,dy);return[a[0]+dx/L*r,a[1]+dy/L*r];};
  for(let i=0;i<n;i++){const c=pts[i],pr=pts[(i-1+n)%n],nx=pts[(i+1)%n],a=at(c,pr,r),b=at(c,nx,r);d+=(i===0?`M ${a[0]} ${a[1]}`:` L ${a[0]} ${a[1]}`)+` Q ${c[0]} ${c[1]} ${b[0]} ${b[1]}`;}
  d+=' Z';const e=mk('path',{d,fill,...(ex||{})});parent.appendChild(e);return e;}
function poly(parent,fill,pts){parent.appendChild(mk('polygon',{points:pts,fill}));}

const bureau=document.getElementById('bureau');
const WHITE=[220,232,246],SCREEN=[111,224,255];
const ZONES=[{c:[168,144,246],gx:0,gy:0},{c:[79,168,240],gx:2,gy:0},{c:[63,214,200],gx:0,gy:2},{c:[95,194,230],gx:2,gy:2}];
// plateau
const N=iso(0,0),E=iso(4,0),S=iso(4,4),W=iso(0,4),slab=16;
poly(bureau,'#0A1428',Pp(E,S,[S[0],S[1]+slab],[E[0],E[1]+slab]));
poly(bureau,'#081020',Pp(S,W,[W[0],W[1]+slab],[S[0],S[1]+slab]));
roundPath(bureau,[N,E,S,W],24,'#0E1A2E');
ZONES.forEach(z=>{
  roundPath(bureau,[iso(z.gx+.2,z.gy+.2),iso(z.gx+1.8,z.gy+.2),iso(z.gx+1.8,z.gy+1.8),iso(z.gx+.2,z.gy+1.8)],14,rgba(z.c,.12));
  const b=roundPath(bureau,[iso(z.gx,z.gy),iso(z.gx+2,z.gy),iso(z.gx+2,z.gy+2),iso(z.gx,z.gy+2)],16,'none',{stroke:rgba(z.c,.9),'stroke-width':'2'});
  b.style.filter=`drop-shadow(0 0 6px ${rgba(z.c,.7)})`;
  poly(bureau,shade(WHITE,1.14),Pp(iso(z.gx+.6,z.gy+.55,.28),iso(z.gx+1.4,z.gy+.55,.28),iso(z.gx+1.4,z.gy+1.05,.28),iso(z.gx+.6,z.gy+1.05,.28)));
  const[sx,sy]=iso(z.gx+1,z.gy+.65,.34);bureau.appendChild(mk('rect',{x:sx-9,y:sy-13,width:18,height:12,rx:3,fill:rgba(SCREEN,.9),transform:'skewY(26)',filter:`drop-shadow(0 0 4px ${rgba(SCREEN,.8)})`}));
  // mini robot
  const[rx,ry]=iso(z.gx+1,z.gy+1,0);const g=mk('g',{transform:`translate(${rx} ${ry-4})`});
  g.appendChild(mk('ellipse',{cx:0,cy:-13,rx:15,ry:15,fill:rgba(z.c,.18)}));
  g.appendChild(mk('rect',{x:-9,y:-14,width:18,height:16,rx:7,fill:'url(#rbg)',stroke:rgba(z.c,.85),'stroke-width':'1.1'}));
  g.appendChild(mk('rect',{x:-11,y:-32,width:22,height:17,rx:9,fill:'url(#rbg)',stroke:rgba(z.c,.85),'stroke-width':'1.1'}));
  g.appendChild(mk('rect',{x:-8,y:-30,width:16,height:11,rx:5,fill:'#0C1A2E'}));
  const e=mk('g',{class:'eye'});e.appendChild(mk('ellipse',{cx:-3.5,cy:-24,rx:1.8,ry:2.4,fill:'#7FE7FF'}));e.appendChild(mk('ellipse',{cx:3.5,cy:-24,rx:1.8,ry:2.4,fill:'#7FE7FF'}));g.appendChild(e);
  bureau.appendChild(g);
});
const CEN=ZONES.map(z=>iso(z.gx+1,z.gy+1,.7));
[[0,1],[1,3],[3,2],[2,0]].forEach(pr=>{const A=CEN[pr[0]],B=CEN[pr[1]],mx=(A[0]+B[0])/2,my=(A[1]+B[1])/2-24;
  const p=mk('path',{d:`M ${A[0]} ${A[1]} Q ${mx} ${my} ${B[0]} ${B[1]}`,fill:'none',stroke:rgba(SCREEN,.5),'stroke-width':'1.3'});p.style.filter=`drop-shadow(0 0 4px ${rgba(SCREEN,.6)})`;bureau.appendChild(p);});

// méthode : rail + noeud Diagnostic (apparait à la fin)
const method=document.getElementById('method');
const rail=mk('line',{x1:600,y1:300,x2:600,y2:900,stroke:'#1779A3','stroke-width':'2','stroke-dasharray':'2 10'});rail.style.opacity=0;method.appendChild(rail);
const dnode=mk('g',{});dnode.style.opacity=0;
dnode.appendChild(mk('circle',{cx:600,cy:430,r:24,fill:'#fff',stroke:'#1779A3','stroke-width':'2'}));
dnode.appendChild(mk('text',{x:600,y:436,fill:'#1779A3','font-family':'Space Grotesk','font-weight':'600','font-size':'15','text-anchor':'middle'})).textContent='01';
dnode.appendChild(mk('text',{x:660,y:424,fill:'#3670CC','font-family':'Space Grotesk','font-weight':'600','font-size':'26'})).textContent='Diagnostic';
method.appendChild(dnode);

const seed=document.getElementById('seed');
const viewport=document.getElementById('viewport');
const cap=document.getElementById('cap'),ck=document.getElementById('ck'),ch=document.getElementById('ch'),cue=document.getElementById('cue');
const DARK=[11,24,48],LIGHT=[245,247,250],NEON=[127,227,255],DEEP=[23,121,163];
const PH=[[0,'LE RÉSULTAT','Votre bureau, agents en place.'],[0.2,'REMBOBINONS','Tout est parti d\u2019une étincelle.'],[0.66,'ÉTAPE 01 · LE DIAGNOSTIC','On repart de l\u2019origine.']];
let cur=-1;

function loop(){
  const sc=document.getElementById('scroll'),rect=sc.getBoundingClientRect();
  let p=Math.max(0,Math.min(1,(-rect.top)/(sc.offsetHeight-innerHeight)));

  // fond sombre (bureau) -> clair (méthode)
  const bgT=ease(seg(p,0.32,0.64));
  viewport.style.background=rgba(lerp(DARK,LIGHT,bgT),1);

  // le bureau se condense en étincelle (scale autour du point (600,300))
  const shrink=ease(seg(p,0.06,0.56));
  const s=1-0.97*shrink;
  bureau.setAttribute('transform',`translate(600 300) scale(${s}) translate(-600 -300)`);
  bureau.style.opacity=1-ease(seg(p,0.42,0.58));

  // l'étincelle (le token) naît quand le bureau se contracte
  const born=ease(seg(p,0.30,0.56));
  const tcol=lerp(NEON,DEEP,bgT);
  seed.setAttribute('r',3+born*5.5);
  seed.setAttribute('fill',rgba(tcol,born));
  seed.style.filter=`drop-shadow(0 0 ${8+born*10}px ${rgba(tcol,.9*born)})`;
  // léger début de descente sur le rail
  const drift=ease(seg(p,0.7,1));
  seed.setAttribute('cy',300+drift*120);

  // la méthode apparait
  const m=ease(seg(p,0.62,0.8));
  rail.style.opacity=m*0.8; dnode.style.opacity=ease(seg(p,0.72,0.9));

  // caption + couleur d'accent selon le fond
  let ph=PH[0];for(const x of PH)if(p>=x[0])ph=x;
  const idx=PH.indexOf(ph);
  if(idx!==cur){cur=idx;cap.style.opacity=0;setTimeout(()=>{ck.textContent=ph[1];ch.textContent=ph[2];cap.style.opacity=1;},160);}
  const onLight=bgT>0.5;
  ck.style.color=onLight?'#1779A3':'#7FE3FF';
  ch.style.color=onLight?'#0C1420':'#EAF1FB';
  cue.style.color=onLight?'#5B6B7D':'#8fa6c4';cue.querySelector('.a').style.color=onLight?'#1779A3':'#7FE3FF';
  cue.style.opacity=Math.max(0,1-p/0.6);

  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
